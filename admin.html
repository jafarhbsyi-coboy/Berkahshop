
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Berkahshop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3f0;
  color: #222;
}

header {
  background: #087b50;
  color: white;
  text-align: center;
  padding: 25px;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 15px;
}

.box {
  background: white;
  padding: 25px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px #0001;
}

input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  padding: 14px 20px;
  border: 0;
  border-radius: 8px;
  background: #087b50;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

.logout {
  background: #c62828;
}

.hidden { display: none; }

#pesan {
  margin-top: 15px;
  overflow-wrap: anywhere;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stat {
  background: #e1f3e9;
  border-radius: 10px;
  padding: 15px;
  text-align: center;
}

.stat h2 {
  color: #087b50;
  font-size: 28px;
}

@media(max-width: 500px) {
  .grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

<body>

<header>
  <h1>BERKAHSHOP</h1>
  <p>Dashboard Administrator</p>
</header>

<div class="container">

<section class="box" id="login">
  <h2>LOGIN ADMIN</h2>

  <input id="email" type="email"
    placeholder="Email Admin"
    autocomplete="username">

  <input id="password" type="password"
    placeholder="Password"
    autocomplete="current-password">

  <button id="tombolMasuk" onclick="loginAdmin()">
    MASUK
  </button>

  <p id="pesan"></p>
</section>

<section id="dashboard" class="hidden">

  <div class="box">
    <h2>SELAMAT DATANG, ADMIN!</h2>
    <p id="namaAdmin">Admin Berkahshop</p>
    <button class="logout" onclick="logoutAdmin()">
      KELUAR
    </button>
  </div>

  <div class="box">
    <h2>STATISTIK MARKETPLACE</h2>

    <div class="grid">
      <div class="stat">
        <h3>Penjual</h3>
        <h2 id="penjual">0</h2>
      </div>

      <div class="stat">
        <h3>Toko</h3>
        <h2 id="toko">0</h2>
      </div>

      <div class="stat">
        <h3>Produk</h3>
        <h2 id="produk">0</h2>
      </div>

      <div class="stat">
        <h3>Pesanan</h3>
        <h2 id="pesanan">0</h2>
      </div>
    </div>
  </div>

  <div class="box">
    <h2>ADMINISTRASI BERKAHSHOP</h2>
    <p>Login administrator berhasil.</p>
    <p>Pengelolaan toko, produk, penjual dan pesanan akan dikembangkan berikutnya.</p>
  </div>

</section>
</div>

<script>
const SUPABASE_URL = "https://cauhaaqyriklxlofqsvc.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_zEWRBwZiW5G-7CDrjfqDPQ_kAtJthh0";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function tampilkanPesan(teks, sukses = false) {
  const pesan = document.getElementById("pesan");
  pesan.textContent = teks;
  pesan.style.color = sukses ? "#087b50" : "#c62828";
}

async function loginAdmin() {
  const tombol = document.getElementById("tombolMasuk");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    tampilkanPesan("Masukkan email dan password.");
    return;
  }

  tombol.disabled = true;
  tampilkanPesan("Sedang menghubungkan ke Supabase...", true);

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) throw error;

    await periksaAdmin(data.user);

  } catch (error) {
    tampilkanPesan("Gagal login: " + error.message);
  } finally {
    tombol.disabled = false;
  }
}

async function periksaAdmin(user) {
  const { data, error } = await db
    .from("profiles")
    .select("nama, role")
    .eq("id", user.id)
    .single();

  if (error) {
    await db.auth.signOut();
    throw new Error("Gagal membaca profil: " + error.message);
  }

  if (data.role !== "admin") {
    await db.auth.signOut();
    throw new Error("Akun ini bukan Admin Berkahshop.");
  }

  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("namaAdmin").textContent =
    data.nama || "Admin Berkahshop";

  await muatStatistik();
}

async function hitung(tabel, kolom, nilai) {
  let query = db.from(tabel).select("*", {
    count: "exact",
    head: true
  });

  if (kolom) query = query.eq(kolom, nilai);

  const { count, error } = await query;

  if (error) {
    console.error(error);
    return "-";
  }

  return count;
}

async function muatStatistik() {
  document.getElementById("penjual").textContent =
    await hitung("profiles", "role", "seller");

  document.getElementById("toko").textContent =
    await hitung("stores");

  document.getElementById("produk").textContent =
    await hitung("products");

  document.getElementById("pesanan").textContent =
    await hitung("orders");
}

async function logoutAdmin() {
  await db.auth.signOut();
  location.reload();
}

async function periksaSesi() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    tampilkanPesan(error.message);
    return;
  }

  if (data.session) {
    try {
      await periksaAdmin(data.session.user);
    } catch (error) {
      tampilkanPesan(error.message);
    }
  }
}

periksaSesi();
</script>

</body>
</html>
