function setBusy(button, busy, busyText) {
  if (!button.dataset.originalText) button.dataset.originalText = button.textContent;
  button.disabled = busy;
  button.textContent = busy ? busyText : button.dataset.originalText;
}

  return String(value ?? "").replace(/[&<>"']/g, (char) => ({

  }
  return true;
}

  await verifyAdmin();
  $("login").style.display = "none";
  $("panel").style.display = "block";
  await loadProducts();
}

  } finally {

}

    setBusy(button, false);
  }
}

}

  button.disabled = busy;

}

  })[char]);
}

  const { data, error } = await db.rpc("is_admin");
  if (error) throw new Error("Pemeriksaan admin gagal: " + error.message);
  if (data !== true) {
    await db.auth.signOut();
    throw new Error("Email ini belum terdaftar sebagai admin Berkahshop.");
  }

}

  await verifyAdmin();
  $("login").style.display = "none";
  $("panel").style.display = "block";
  await loadProducts();
}

async function loginAdmin() {
  const button = $("btnLogin");
  const email = $("email").value.trim() || ADMIN_EMAIL;
  const password = $("password").value;

  if (!email || !password) {
    showMessage("Masukkan email dan password admin terlebih dahulu.");
    return;
  }

  setBusy(button, true, "MEMERIKSA...");
  showMessage("Sedang menghubungkan ke Supabase...");

  try {
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await openAdminPanel();
    showMessage("Login berhasil.");
  } catch (error) {
    showMessage("Login gagal: " + (error.message || "Terjadi kesalahan."));
  } finally {

  }
}

  const button = $("btnForgotPassword");
  const email = $("email").value.trim() || ADMIN_EMAIL;

  if (!email) {
    showMessage("Masukkan email admin terlebih dahulu.");
    return;
  }

  setBusy(button, true, "MENGIRIM...");
  showMessage("Sedang mengirim tautan reset password...");

  } finally {

async function updatePassword() {
  const button = $("btnUpdatePassword");
  const password = $("newPassword").value;

  if (password.length < 6) {
    showMessage("Password baru minimal 6 karakter.");
    return;
  }

  setBusy(button, true, "MENYIMPAN...");
  try {
    const { error } = await db.auth.updateUser({ password });
    if (error) throw error;

    await db.auth.signOut();
    $("recoveryBox").style.display = "none";
    $("password").value = "";
    $("newPassword").value = "";
    $("login").style.display = "block";
    $("panel").style.display = "none";
    showMessage("Password berhasil diperbarui. Silakan masuk menggunakan password baru.");
  } catch (error) {
    showMessage("Gagal memperbarui password: " + (error.message || "Terjadi kesalahan."));
  } finally {
    setBusy(button, false);
  }
}

async function logoutAdmin() {
  const { error } = await db.auth.signOut();
  if (error) {
    showMessage("Gagal keluar: " + error.message);
    return;
  }
  $("panel").style.display = "none";
  $("login").style.display = "block";
  $("password").value = "";
  showMessage("Anda sudah keluar dari akun admin.");
}

async function loadProducts() {
  $("productList").textContent = "Memuat produk...";
  const { data, error } = await db.from("products").select("*").order("id", { ascending: false });

  if (error) {
    $("productList").textContent = "Gagal memuat produk: " + error.message;
    return;
  }
  if (!data || data.length === 0) {
    $("productList").textContent = "Belum ada produk.";
    return;
  }

  $("productList").innerHTML = data.map((product) => {
    const imageURL = String(product.image_url || "");
    const safeImage = /^https?:\/\//i.test(imageURL)
      ? `<img src="${escapeHTML(imageURL)}" alt="Foto produk" loading="lazy">`
      : "";

    return `<div class="product">
      <b>${escapeHTML(product.name)}</b><br>
      Harga: Rp${Number(product.price).toLocaleString("id-ID")}<br>
      Kategori: ${escapeHTML(product.category || "-")}<br>
      Stok: ${escapeHTML(product.stock)}<br>
      ${safeImage}
      <button type="button" data-edit="${escapeHTML(product.id)}">Edit</button>
      <button type="button" class="danger" data-delete="${escapeHTML(product.id)}">Hapus</button>
    </div>`;
  }).join("");
}

async function saveProduct() {
  const id = $("productId").value;
  const priceText = $("price").value;
  const stockText = $("stock").value;

  const product = {
    name: $("name").value.trim(),
    price: Number(priceText),
    category: $("category").value.trim() || null,
    stock: Number(stockText),
    image_url: $("image").value.trim() || null,
    description: $("description").value.trim() || null
  };

  if (!product.name || priceText === "" || !Number.isFinite(product.price) || product.price < 0 ||
      stockText === "" || !Number.isInteger(product.stock) || product.stock < 0) {
    alert("Periksa nama, harga, dan stok produk. Harga harus 0 atau lebih, stok bilangan bulat 0 atau lebih.");
    return;
  }
  if (product.image_url && !/^https?:\/\//i.test(product.image_url)) {
    alert("URL foto harus diawali http:// atau https://");
    return;
  }

  const button = $("btnSave");
  setBusy(button, true, "MENYIMPAN...");
  try {
    const result = id
      ? await db.from("products").update(product).eq("id", id)
      : await db.from("products").insert(product);
    if (result.error) throw result.error;
    alert("Produk berhasil disimpan.");
    resetForm();
    await loadProducts();
  } catch (error) {
    alert("Gagal menyimpan produk: " + (error.message || "Terjadi kesalahan."));
  } finally {
    setBusy(button, false);
  }
}

async function editProduct(id) {
  const { data, error } = await db.from("products").select("*").eq("id", id).single();
  if (error) {
    alert("Gagal mengambil produk: " + error.message);
    return;
  }
  $("productId").value = data.id;
  $("name").value = data.name || "";
  $("price").value = data.price ?? "";
  $("category").value = data.category || "";
  $("stock").value = data.stock ?? "";
  $("image").value = data.image_url || "";
  $("description").value = data.description || "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteProduct(id) {
  if (!confirm("Yakin ingin menghapus produk ini?")) return;
  const { error } = await db.from("products").delete().eq("id", id);
  if (error) {
    alert("Gagal menghapus produk: " + error.message);
    return;
  }
  alert("Produk berhasil dihapus.");
  await loadProducts();
}

function resetForm() {
  ["productId", "name", "price", "category", "stock", "image", "description"].forEach((id) => {
    $(id).value = "";
  });
}

$("btnLogin").addEventListener("click", loginAdmin);
$("btnForgotPassword").addEventListener("click", forgotPassword);
$("btnUpdatePassword").addEventListener("click", updatePassword);
$("btnLogout").addEventListener("click", logoutAdmin);
$("btnSave").addEventListener("click", saveProduct);
$("btnReset").addEventListener("click", resetForm);

$("productList").addEventListener("click", (event) => {
  const editButton = event.target.closest("[data-edit]");
  const deleteButton = event.target.closest("[data-delete]");
  if (editButton) editProduct(editButton.dataset.edit);
  if (deleteButton) deleteProduct(deleteButton.dataset.delete);
});

// Supabase mengirim event PASSWORD_RECOVERY setelah tautan email dibuka.
db.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    $("login").style.display = "block";
    $("panel").style.display = "none";
    $("recoveryBox").style.display = "block";
    showMessage("Tautan pemulihan terdeteksi. Silakan buat password baru.");
  }
});

async function checkSession() {
  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;
    if (data.session) {
      await openAdminPanel();
    }
  } catch (error) {
    showMessage("Pemeriksaan sesi: " + (error.message || "Terjadi kesalahan."));
  }
}

checkSession();
</script>
