
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Berkahshop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:18px;color:#222}
main{max-width:600px;margin:auto}
.box{background:white;padding:20px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border-radius:7px}
input{border:1px solid #ccc}
button{border:0;background:#087b45;color:white;font-weight:bold}
.danger{background:#c62828}
h2{text-align:center}
#panel,#resetBox{display:none}
#status{color:#087b45;text-align:center}
</style>
</head>
<body>
<main>

<section class="box" id="login">
<h2>LOGIN ADMIN BERKAHSHOP</h2>
<input id="email" type="email" placeholder="Email admin">
<input id="password" type="password"
<button id="btnLogin">MASUK</button>
<button id="btnReset" type="button">LUPA PASSWORD</button>
</section>

<section class="box" id="resetBox">
<h2>GANTI PASSWORD</h2>
<input id="newPassword" type="password" placeholder="Password baru">
<button id="btnUpdatePassword">SIMPAN PASSWORD BARU</button>
</section>

<section class="box" id="panel">
<h2>PENGELOLAAN PRODUK</h2>
<input id="nama" placeholder="Nama produk">
<input id="harga" type="number" placeholder="Harga produk">
<input id="stok" type="number" placeholder="Stok produk">
<input id="foto" type="text" placeholder="URL foto produk">
<button id="btnTambah">TAMBAH PRODUK</button>
<button class="danger" id="btnLogout">KELUAR</button>
</section>

<p id="status"></p>
</main>

<script>
const SUPABASE_URL = "MASUKKAN_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "MASUKKAN_SUPABASE_ANON_PUBLIC_KEY";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const statusText = document.getElementById("status");

function status(pesan){
statusText.textContent = pesan;
}

async function verifyAdmin(){
const {data,error} = await db.auth.getUser();

if(error || !data.user){
throw new Error("Login tidak valid");
}

const {data:admin,error:adminError} = await db
.from("admins")
.select("*")
.eq("email",data.user.email)
.maybeSingle();

if(adminError || !admin){
await db.auth.signOut();
throw new Error("Akun bukan admin");
}

document.getElementById("login").style.display="none";
document.getElementById("resetBox").style.display="none";
document.getElementById("panel").style.display="block";
status("Login admin berhasil");
}

document.getElementById("btnLogin").onclick=async()=>{
try{
status("Memproses login...");
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

const {error}=await db.auth.signInWithPassword({
email,password
});

if(error) throw error;
await verifyAdmin();

}catch(e){
status("Gagal: "+e.message);
}
};

document.getElementById("btnReset").onclick=async()=>{
try{
const email=document.getElementById("email").value.trim();
if(!email) throw new Error("Masukkan email admin");

const {error}=await db.auth.resetPasswordForEmail(email,{
redirectTo:location.origin+location.pathname
});

if(error) throw error;
status("Link reset dikirim. Periksa email.");
}catch(e){
status("Gagal: "+e.message);
}
};

document.getElementById("btnUpdatePassword").onclick=async()=>{
try{
const password=document.getElementById("newPassword").value;
if(password.length<8) throw new Error("Minimal 8 karakter");

const {error}=await db.auth.updateUser({password});
if(error) throw error;

status("Password berhasil diperbarui");
document.getElementById("resetBox").style.display="none";
document.getElementById("login").style.display="block";
}catch(e){
status("Gagal: "+e.message);
}
};

document.getElementById("btnTambah").onclick=async()=>{
try{
const nama=document.getElementById("nama").value.trim();
const harga=Number(document.getElementById("harga").value);
const stok=Number(document.getElementById("stok").value);
const foto=document.getElementById("foto").value.trim();

if(!nama || !harga) throw new Error("Lengkapi nama dan harga");

const {error}=await db.from("products").insert([{
nama,harga,stok,foto
}]);

if(error) throw error;
status("Produk berhasil ditambahkan");
}catch(e){
status("Gagal: "+e.message);
}
};

document.getElementById("btnLogout").onclick=async()=>{
await db.auth.signOut();
location.reload();
};

db.auth.getSession().then(async({data})=>{
if(data.session){
try{await verifyAdmin();}
catch(e){status(e.message);}
}
});

db.auth.onAuthStateChange((event,session)=>{
if(event==="PASSWORD_RECOVERY"){
document.getElementById("login").style.display="none";
document.getElementById("resetBox").style.display="block";
status("Silakan masukkan password baru");
}
});
</script>
</body>
</html>
