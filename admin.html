
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Berkahshop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #eef3f0;
  margin: 0;
  padding: 20px;
  color: #222;
}

main {
  max-width: 550px;
  margin: 25px auto;
}

.box {
  background: white;
  padding: 22px;
  margin-bottom: 18px;
  border-radius: 14px;
  box-shadow: 0 3px 12px #00000015;
}

h2 {
  text-align: center;
  color: #087b45;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 8px;
  background: #087b45;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.secondary {
  background: #1769aa;
}

.danger {
  background: #c62828;
}

#panel, #resetBox {
  display: none;
}

#status {
  text-align: center;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.note {
  text-align: center;
  color: #666;
  font-size: 13px;
}
</style>
</head>

<body>
<main>

<section class="box" id="login">
  <h2>LOGIN ADMIN BERKAHSHOP</h2>

  <label for="email">Email Admin</label>
  <input
    id="email"
    type="email"
    placeholder="Masukkan email admin"
    autocomplete="username"
    required
  >

  <label for="password">Password</label>
  <input
    id="password"
    type="password"
    placeholder="Masukkan password"
    autocomplete="current-password"
    required
  >

  <button type="button" id="btnLogin">MASUK</button>
  <button type="button" class="secondary" id="btnReset">
    LUPA PASSWORD
  </button>

  <p class="note">Admin Berkahshop</p>
</section>

<section class="box" id="resetBox">
  <h2>GANTI PASSWORD ADMIN</h2>

  <label for="newPassword">Password Baru</label>
  <input
    id="newPassword"
    type="password"
    placeholder="Masukkan password baru"
    autocomplete="new-password"
  >

  <button type="button" id="btnUpdatePassword">
    SIMPAN PASSWORD BARU
  </button>
</section>

<section class="box" id="panel">
  <h2>PANEL ADMIN BERKAHSHOP</h2>

  <p>Login berhasil. Selamat datang di panel admin.</p>

  <h3>Tambah Produk</h3>

  <label for="nama">Nama Produk</label>
  <input id="nama" placeholder="Nama produk">

  <label for="harga">Harga Produk</label>
  <input id="harga" type="number" min="1" placeholder="Harga">

  <label for="stok">Stok Produk</label>
  <input id="stok" type="number" min="0" placeholder="Jumlah stok">

  <label for="foto">URL Foto Produk</label>
  <input id="foto" type="url" placeholder="https://alamat-foto.jpg">

  <button type="button" id="btnTambah">
    TAMBAH PRODUK
  </button>

  <button type="button" class="danger" id="btnLogout">
    KELUAR ADMIN
  </button>
</section>

<p id="status" role="status" aria-live="polite"></p>

</main>

<script>
"use strict";

// KONFIGURASI SUPABASE BARU
const SUPABASE_URL =
  "https://cauhaaqyriklxlofqsvc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_zEWRBwZiW5G-7CDrjfqDPQ_kAtJthh0";


const ADMIN_EMAIL = "jafarhbsyi@gmail.com";


const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let sedangProses = false;

function status(pesan, gagal = false) {
  $("status").textContent = pesan;
  $("status").style.color = gagal ? "#c62828" : "#087b45";
}

function tampilkan(halaman) {
  $("login").style.display =
    halaman === "login" ? "block" : "none";

  $("resetBox").style.display =
    halaman === "reset" ? "block" : "none";

  $("panel").style.display =
    halaman === "panel" ? "block" : "none";
}

function kunciTombol(id, aktif) {
  $(id).disabled = aktif;
}

async function verifyAdmin() {
  const { data, error } = await db.auth.getUser();

  if (error || !data.user) {
    throw new Error("Sesi login tidak ditemukan.");
  }

  const email = (data.user.email || "").toLowerCase();

  if (email !== ADMIN_EMAIL.toLowerCase()) {
    await db.auth.signOut();
    throw new Error("Email ini bukan email admin Berkahshop.");
  }

  const { data: admin, error: adminError } = await db
    .from("admins")
    .select("email")
    .eq("email", email)
    .maybeSingle();

  if (adminError) {
    throw new Error("Gagal memeriksa tabel admins: " +
      adminError.message);
  }

  if (!admin) {
    await db.auth.signOut();
    throw new Error("Email belum terdaftar sebagai admin.");
  }

  tampilkan("panel");
  status("Login admin berhasil. Selamat bekerja!");
}

// LOGIN ADMIN
$("btnLogin").addEventListener("click", async () => {
  if (sedangProses) return;

  const email = $("email").value.trim().toLowerCase();
  const password = $("password").value;

  if (!email || !password) {
    status("Masukkan email dan password.", true);
    return;
  }

  sedangProses = true;
  kunciTombol("btnLogin", true);
  status("Sedang memeriksa login...");

  try {
    const { error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    await verifyAdmin();

  } catch (error) {
    status("Login gagal: " + error.message, true);
  } finally {
    sedangProses = false;
    kunciTombol("btnLogin", false);
  }
});

// RESET PASSWORD
$("btnReset").addEventListener("click", async () => {
  const email = $("email").value.trim().toLowerCase();

  if (!email) {
    status("Masukkan email admin terlebih dahulu.", true);
    return;
  }

  if (email !== ADMIN_EMAIL.toLowerCase()) {
    status("Gunakan email admin yang terdaftar.", true);
    return;
  }

  kunciTombol("btnReset", true);
  status("Mengirim link reset password...");

  try {
    const { error } = await db.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:
          "https://jafarhbsyi-coboy.github.io/Berkahshop/admin.html"
      }
    );

    if (error) throw error;

    status("Link reset telah diminta. Periksa email admin.");

  } catch (error) {
    status("Reset gagal: " + error.message, true);
  } finally {
    kunciTombol("btnReset", false);
  }
});

// SIMPAN PASSWORD BARU
$("btnUpdatePassword").addEventListener("click", async () => {
  const password = $("newPassword").value;

  if (password.length < 8) {
    status("Password minimal 8 karakter.", true);
    return;
  }

  kunciTombol("btnUpdatePassword", true);

  try {
    const { error } = await db.auth.updateUser({
      password: password
    });

    if (error) throw error;

    $("newPassword").value = "";
    await db.auth.signOut();

    tampilkan("login");
    status("Password berhasil diperbarui. Silakan login kembali.");

  } catch (error) {
    status("Gagal mengganti password: " + error.message, true);
  } finally {
    kunciTombol("btnUpdatePassword", false);
  }
});

// TAMBAH PRODUK
$("btnTambah").addEventListener("click", async () => {
  const nama = $("nama").value.trim();
  const harga = Number($("harga").value);
  const stok = Number($("stok").value);
  const foto = $("foto").value.trim();

  if (!nama || !Number.isFinite(harga) || harga <= 0) {
    status("Nama dan harga produk wajib diisi dengan benar.", true);
    return;
  }

  if (!Number.isInteger(stok) || stok < 0) {
    status("Stok harus berupa angka nol atau lebih.", true);
    return;
  }

  kunciTombol("btnTambah", true);
  status("Menyimpan produk...");

  try {
    await verifyAdmin();

    const { error } = await db
      .from("products")
      .insert([{
        nama: nama,
        harga: harga,
        stok: stok,
        foto: foto
      }]);

    if (error) throw error;

    $("nama").value = "";
    $("harga").value = "";
    $("stok").value = "";
    $("foto").value = "";

    status("Produk berhasil ditambahkan!");

  } catch (error) {
    status("Gagal menyimpan produk: " + error.message, true);
  } finally {
    kunciTombol("btnTambah", false);
  }
});

// LOGOUT
$("btnLogout").addEventListener("click", async () => {
  try {
    const { error } = await db.auth.signOut();

    if (error) throw error;

    $("password").value = "";
    tampilkan("login");
    status("Kamu sudah keluar dari admin.");

  } catch (error) {
    status("Gagal keluar: " + error.message, true);
  }
});

// PEMERIKSAAN SESI SAAT HALAMAN DIBUKA
async function mulaiAdmin() {
  try {
    const { data, error } = await db.auth.getSession();

    if (error) throw error;

    if (data.session) {
      await verifyAdmin();
    } else {
      tampilkan("login");
      status("Silakan login sebagai admin.");
    }

  } catch (error) {
    tampilkan("login");
    status("Pemeriksaan sesi: " + error.message, true);
  }
}

db.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    tampilkan("reset");
    status("Masukkan password baru.");
  }
});

mulaiAdmin();
</script>

</body>
</html>
