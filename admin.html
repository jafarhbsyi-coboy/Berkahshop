
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Berkahshop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3f0;
  color: #222;
}

header {
  background: #087b50;
  color: white;
  padding: 22px;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: 25px auto;
  padding: 15px;
}

.box {
  background: white;
  padding: 22px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px #0001;
}

input {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 7px;
}

button {
  padding: 12px 18px;
  border: 0;
  border-radius: 7px;
  background: #087b50;
  color: white;
  cursor: pointer;
  font-size: 15px;
}

.logout {
  background: #c62828;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stat {
  background: #e1f3e9;
  padding: 18px;
  border-radius: 10px;
  text-align: center;
}

.stat h2 {
  color: #087b50;
  font-size: 28px;
}

.hidden {
  display: none;
}

#pesan {
  color: #c62828;
  margin-top: 12px;
}
</style>
</head>

<body>

<header>
  <h1>BERKAHSHOP</h1>
  <p>Dashboard Administrator</p>
</header>

<div class="container">

<section class="box" id="login">
  <h2>LOGIN ADMIN</h2>

  <input
    type="email"
    id="email"
    placeholder="Email Admin"
    autocomplete="username"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button onclick="loginAdmin()">MASUK</button>

  <p id="pesan"></p>
</section>

<section id="dashboard" class="hidden">

  <div class="box">
    <h2>Selamat Datang, Admin!</h2>
    <p id="namaAdmin">Admin Berkahshop</p>
    <button class="logout" onclick="logoutAdmin()">
      KELUAR
    </button>
  </div>

  <div class="box">
    <h2>Statistik Marketplace</h2>

    <div class="grid">

      <div class="stat">
        <h3>Penjual</h3>
        <h2 id="penjual">0</h2>
      </div>

      <div class="stat">
        <h3>Toko</h3>
        <h2 id="toko">0</h2>
      </div>

      <div class="stat">
        <h3>Produk</h3>
        <h2 id="produk">0</h2>
      </div>

      <div class="stat">
        <h3>Pesanan</h3>
        <h2 id="pesanan">0</h2>
      </div>

    </div>
  </div>

  <div class="box">
    <h2>Manajemen Berkahshop</h2>
    <p>Dashboard utama berhasil dibuka.</p>
    <p>Pengelolaan penjual, toko, produk, dan pesanan akan kita tambahkan bertahap.</p>
  </div>

</section>

</div>

<script>
const SUPABASE_URL = "https://cauhaaqyriklxlofqsvc.supabase.co/rest/v1/L";
const SUPABASE_KEY = "sb_publishable_zEWRBwZiW5G-7CDrjfqDPQ_kAtJthh0";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loginAdmin() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const pesan = document.getElementById("pesan");

  pesan.textContent = "Memeriksa akun...";

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    pesan.textContent = error.message;
    return;
  }

  await periksaAdmin(data.user);
}

async function periksaAdmin(user) {
  const { data, error } = await db
    .from("profiles")
    .select("nama, role")
    .eq("id", user.id)
    .single();

  if (error || !data || data.role !== "admin") {
    await db.auth.signOut();
    document.getElementById("pesan").textContent =
      "Akun ini tidak memiliki akses Admin.";
    return;
  }

  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("namaAdmin").textContent =
    data.nama || "Admin Berkahshop";

  await muatStatistik();
}

async function hitung(tabel, kolom, nilai) {
  let query = db.from(tabel).select("*", {
    count: "exact",
    head: true
  });

  if (kolom) {
    query = query.eq(kolom, nilai);
  }

  const { count, error } = await query;

  if (error) {
    console.error(error);
    return "-";
  }

  return count;
}

async function muatStatistik() {
  document.getElementById("penjual").textContent =
    await hitung("profiles", "role", "seller");

  document.getElementById("toko").textContent =
    await hitung("stores");

  document.getElementById("produk").textContent =
    await hitung("products");

  document.getElementById("pesanan").textContent =
    await hitung("orders");
}

async function logoutAdmin() {
  await db.auth.signOut();
  location.reload();
}

async function periksaSesi() {
  const { data } = await db.auth.getSession();

  if (data.session) {
    await periksaAdmin(data.session.user);
  }
}

periksaSesi();
</script>

</body>
</html>
