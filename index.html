
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berkahshop - Marketplace-Tempat Belanja kita semua</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f5f5;
 color:#222;
}
header{
 background:#673ab7;
 color:white;
 padding:20px;
 text-align:center;
}
header h1{margin:0 0 8px}
header p{margin:0}
.search{
 padding:15px;
 text-align:center;
 background:white;
}
input,select{
 padding:12px;
 border:1px solid #ddd;
 border-radius:8px;
 width:100%;
 max-width:500px;
}
nav{
 display:flex;
 justify-content:center;
 gap:10px;
 flex-wrap:wrap;
 padding:12px;
 background:white;
}
nav button{
 border:0;
 background:#eee;
 padding:10px 15px;
 border-radius:20px;
 cursor:pointer;
}
.container{padding:15px;max-width:1100px;margin:auto}
.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:15px;
}
.card{
 background:white;
 border-radius:12px;
 padding:12px;
 box-shadow:0 2px 8px #ddd;
}
.card img{
 width:100%;
 height:140px;
 object-fit:cover;
 border-radius:8px;
}
.card h3{font-size:16px}
.price{color:#e65100;font-weight:bold}
button.buy{
 background:#673ab7;
 color:white;
 border:0;
 border-radius:7px;
 padding:10px;
 width:100%;
 cursor:pointer;
}
.cart{
 background:white;
 padding:18px;
 margin-top:25px;
 border-radius:12px;
}
.cart-item{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:9px 0;
 border-bottom:1px solid #eee;
}
.checkout{
 background:#128c50;
 color:white;
 border:0;
 padding:13px;
 border-radius:8px;
 width:100%;
 font-weight:bold;
 cursor:pointer;
}
footer{
 background:#333;
 color:white;
 text-align:center;
 padding:20px;
 margin-top:30px;
}
</style>
</head>
<body>

<header>
<h1>BERKAHSHOP</h1>
<p>Belanja mudah, hemat dan berkah</p>
</header>

<div class="search">
<input id="search" placeholder="Cari produk..." oninput="renderProducts()">
</div>

<nav>
<button onclick="setCategory('Semua')">Semua</button>
<button onclick="setCategory('Elektronik')">Elektronik</button>
<button onclick="setCategory('Fashion')">Fashion</button>
<button onclick="setCategory('Makanan')">Makanan</button>
<button onclick="setCategory('Rumah')">Rumah tangga</button>
</nav>

<main class="container">
<h2>Produk Pilihan</h2>
<div class="products" id="products"></div>

<section class="cart">
<h2>🛒 Keranjang Belanja</h2>
<div id="cartItems">Keranjang masih kosong</div>
<h3 id="total">Total: Rp0</h3>
<button class="checkout" onclick="checkout()">
Checkout via WhatsApp
</button>
</section>
</main>

<footer>
<p>© 2026 Berkahshop</p>
<p>Marketplace Belanja Anda</p>
</footer>

<script>
const admin="6281991391551";

const products=[
{id:1,name:"Smartphone",price:1500000,category:"Elektronik",image:"https://placehold.co/300x200?text=Smartphone"},
{id:2,name:"Headphone",price:150000,category:"Elektronik",image:"https://placehold.co/300x200?text=Headphone"},
{id:3,name:"Kaos Pria",price:75000,category:"Fashion",image:"https://placehold.co/300x200?text=Kaos"},
{id:4,name:"Sepatu",price:175000,category:"Fashion",image:"https://placehold.co/300x200?text=Sepatu"},
{id:5,name:"Kopi Jahe",price:5000,category:"Makanan",image:"https://placehold.co/300x200?text=Kopi+Jahe"},
{id:6,name:"Minyak Wangi",price:25000,category:"Rumah",image:"https://placehold.co/300x200?text=Parfum"}
];

let cart=[];
let category="Semua";

function rupiah(n){
 return "Rp"+n.toLocaleString("id-ID");
}

function setCategory(c){
 category=c;
 renderProducts();
}

function renderProducts(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>
 (category==="Semua"||p.category===category)&&
 p.name.toLowerCase().includes(q)
 );

 document.getElementById("products").innerHTML=
 list.map(p=>`
 <div class="card">
 <img src="${p.image}" alt="${p.name}">
 <h3>${p.name}</h3>
 <p class="price">${rupiah(p.price)}</p>
 <button class="buy" onclick="addCart(${p.id})">
 + Keranjang
 </button>
 </div>
 `).join("");
}

function addCart(id){
 const item=cart.find(x=>x.id===id);
 if(item)item.qty++;
 else cart.push({id:id,qty:1});
 renderCart();
}

function renderCart(){
 let total=0;
 const box=document.getElementById("cartItems");

 if(cart.length===0){
 box.innerHTML="Keranjang masih kosong";
 }else{
 box.innerHTML=cart.map(item=>{
 const p=products.find(x=>x.id===item.id);
 const sub=p.price*item.qty;
 total+=sub;
 return `<div class="cart-item">
 <span>${p.name} x ${item.qty}</span>
 <span>${rupiah(sub)}
 <button onclick="removeCart(${p.id})">Hapus</button>
 </span></div>`;
 }).join("");
 }

 document.getElementById("total").textContent=
 "Total: "+rupiah(total);
}

function removeCart(id){
 cart=cart.filter(x=>x.id!==id);
 renderCart();
}

function checkout(){
 if(cart.length===0){
 alert("Keranjang masih kosong!");
 return;
 }

 const nama=prompt("Nama lengkap:");
 if(!nama||!nama.trim())return;

 const hp=prompt("Nomor HP:");
 if(!hp||!hp.trim())return;

 const alamat=prompt("Alamat pengiriman:");
 if(!alamat||!alamat.trim())return;

 let total=0;
 const daftar=cart.map(item=>{
 const p=products.find(x=>x.id===item.id);
 const sub=p.price*item.qty;
 total+=sub;
 return `- ${p.name} x ${item.qty} = ${rupiah(sub)}`;
 }).join("\n");

 const pesan=
 `PESANAN BERKAHSHOP\n\n`+
 `Nama: ${nama}\nHP: ${hp}\nAlamat: ${alamat}\n\n`+
 `Produk:\n${daftar}\n\n`+
 `Total: ${rupiah(total)}\n\n`+
 `Mohon konfirmasi pesanan saya.`;

 window.open(
 "https://wa.me/"+admin+"?text="+encodeURIComponent(pesan),
 "_blank"
 );
}

renderProducts();
renderCart();
</script>

</body>
</html>
